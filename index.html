<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ばねばかり実験シミュレーター</title>
<style>
:root{--blue:#1688f8;--blue2:#62b8ff;--ink:#173f68;--pale:#f4faff;--line:#cfe5fc}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:1120px;margin:auto;padding:18px}
h1{margin:0 0 6px;font-size:clamp(22px,3vw,32px);font-weight:850}
.intro{margin:0 0 18px;color:#66819d;font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:18px}
.stage,.panel{border:1px solid var(--line);border-radius:20px;background:rgba(249,252,255,.94);box-shadow:0 8px 25px #1c65a20d}
.stage{position:relative;min-height:830px;padding:8px;overflow:hidden}
#scene{display:block;width:100%;height:810px;touch-action:none}
.dropnote{position:absolute;bottom:12px;left:12px;right:12px;text-align:center;color:#6788a8;font-size:12px;pointer-events:none}
.panel{overflow:hidden;margin-bottom:15px}
.head{padding:13px 17px;background:linear-gradient(110deg,#1685f4,#5bb5ff);color:#fff;font-weight:850;font-size:18px}
.body{padding:14px}
.stat{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:1px solid #dcecff;border-radius:13px;background:#fff;margin-bottom:9px}
.stat:last-child{margin-bottom:0}.stat span{font-size:14px;font-weight:700;color:#345e88}.stat strong{font-size:clamp(22px,3vw,31px);white-space:nowrap;color:#0878ed}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{padding:12px 7px;border:2px solid #cbdff5;border-radius:13px;background:#fff;color:#286194;font:inherit;font-weight:800;cursor:pointer}
.choice[aria-pressed=true]{background:linear-gradient(110deg,#1685f4,#369eff);border-color:#1688f8;color:#fff}
.weights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.weight{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;padding:8px 3px 10px;border:1px solid #d7e8fa;border-radius:13px;background:white;color:#234d78;cursor:grab;touch-action:none;user-select:none}
.weight:active{cursor:grabbing}
.weight svg{width:100%;max-width:57px;height:65px;overflow:visible}
.weight b{font-size:14px}.weight small{font-size:10px;color:#6b88a7}
.hint{margin:10px 1px 0;color:#6a85a1;font-size:12px;line-height:1.7}
.reset{width:100%;margin-top:12px;padding:11px;border:1px solid #bfdcff;border-radius:12px;background:#edf7ff;color:#176bb8;font:inherit;font-weight:800;cursor:pointer}
#ghost{position:fixed;z-index:100;pointer-events:none;display:none;opacity:.94;filter:drop-shadow(0 6px 5px #294d6b33)}
@media(max-width:760px){main{padding:10px}.layout{grid-template-columns:1fr}.stage{min-height:640px}#scene{height:620px}.weights{gap:5px}}
</style>
</head>
<body>
<main>
  <h1>ばねばかり実験シミュレーター</h1>
  <p class="intro">おもりをフックにドラッグして、重さとばねの伸びの関係を観察しよう。</p>
  <div class="layout">
    <section class="stage" aria-label="ばねばかり実験エリア">
      <svg id="scene" viewBox="0 0 560 830" role="img" aria-label="目盛り付きばねばかり">
        <defs>
          <linearGradient id="metal" x1="0" x2="1"><stop stop-color="#596574"/><stop offset=".2" stop-color="#f0f3f7"/><stop offset=".48" stop-color="#8995a2"/><stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#626e7d"/></linearGradient>
          <linearGradient id="weightMetal" x1="0" x2="1"><stop stop-color="#687483"/><stop offset=".23" stop-color="#f8fafc"/><stop offset=".52" stop-color="#8d99a7"/><stop offset=".8" stop-color="#f1f4f7"/><stop offset="1" stop-color="#5c6673"/></linearGradient>
          <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#31516c" flood-opacity=".18"/></filter>
        </defs>
        <!-- stand -->
        <g stroke="#303c4b" stroke-linejoin="round">
          <rect x="35" y="790" width="190" height="24" rx="6" fill="#4d5b6d" stroke-width="2"/>
          <rect x="65" y="35" width="24" height="758" rx="7" fill="url(#metal)" stroke-width="2"/>
          <rect x="70" y="20" width="14" height="24" rx="4" fill="url(#metal)" stroke-width="1.5"/>
          <rect x="78" y="49" width="315" height="15" rx="5" fill="url(#metal)" stroke-width="2"/>
          <rect x="61" y="43" width="9" height="28" rx="3" fill="#273343" stroke-width="1.5"/>
        </g>
        <rect x="241" y="43" width="40" height="28" rx="5" fill="url(#metal)" stroke="#303c4b" stroke-width="2"/>
        <path d="M261 71v12c0 8 14 8 14 19c0 10-15 12-15 1" fill="none" stroke="#394552" stroke-width="5" stroke-linecap="round"/>
        <path d="M261 71v12c0 8 14 8 14 19c0 10-15 12-15 1" fill="none" stroke="#d9e0e7" stroke-width="2" stroke-linecap="round"/>
        <!-- spring scale housing -->
        <rect x="225" y="101" width="75" height="520" rx="13" fill="url(#metal)" stroke="#46515e" stroke-width="2.5" filter="url(#shadow)"/>
        <rect x="232" y="110" width="61" height="504" rx="8" fill="#fbfdff" stroke="#aab6c2" stroke-width="1.5"/>
        <g id="ticks"></g>
        <path id="springShadow" fill="none" stroke="#414b56" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        <path id="springHi" fill="none" stroke="#d9e1e9" stroke-width="1.2" stroke-linejoin="round"/>
        <line id="indicator" x1="233" x2="292" y1="185" y2="185" stroke="#fa5555" stroke-width="4" stroke-linecap="round"/>
        <g id="movingHook">
          <rect x="252" y="190" width="22" height="10" rx="4" fill="url(#metal)" stroke="#46515e" stroke-width="1.5"/>
          <path id="hook" d="M263 199v10c0 12 13 11 13 1c0-5-4-6-6-3" fill="none" stroke="#4c5967" stroke-width="5" stroke-linecap="round"/>
          <path id="hookHi" d="M263 199v10c0 12 13 11 13 1c0-5-4-6-6-3" fill="none" stroke="#e9edf1" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <g id="attached" style="display:none" filter="url(#shadow)">
          <g id="attachedBody"></g>
        </g>
        <g transform="translate(340 112)">
          <rect width="190" height="86" rx="15" fill="#f4faff" stroke="#b7ddff" stroke-width="2"/>
          <text x="15" y="27" fill="#3476b2" font-size="13" font-weight="700">ばねの伸び</text>
          <text id="extensionOnScene" x="15" y="61" fill="#0878ed" font-size="28" font-weight="850">0 cm</text>
        </g>
        <text x="340" y="222" font-size="12" fill="#6888a8">目盛り：1目盛り = 1 cm</text>
        <path id="guide" d="" stroke="#1688f8" stroke-width="2" stroke-dasharray="5 5" fill="none" opacity=".65"/>
        <text id="overflow" x="340" y="248" fill="#df6a36" font-size="12" font-weight="700" style="display:none">※ 目盛りの範囲を超えています</text>
      </svg>
      <div class="dropnote">おもりを下のフックへドラッグしてね ・ 取り外すときはおもりをクリック</div>
    </section>
    <aside>
      <section class="panel">
        <div class="head">現在の状態</div>
        <div class="body">
          <div class="stat"><span>おもりの個数</span><strong id="count">0 個</strong></div>
          <div class="stat"><span>合計質量</span><strong id="mass">0 g</strong></div>
          <div class="stat"><span>バネの伸び</span><strong id="extension">0 cm</strong></div>
        </div>
      </section>
      <section class="panel">
        <div class="head">バネの硬さ</div>
        <div class="body choices">
          <button class="choice" id="soft" aria-pressed="false">やわらかい</button>
          <button class="choice" id="hard" aria-pressed="true">かたい</button>
        </div>
      </section>
      <section class="panel">
        <div class="head">おもりを選ぶ</div>
        <div class="body">
          <div class="weights">
            <button class="weight" data-mass="1" aria-label="1グラムのおもりをドラッグ">
              <svg viewBox="0 0 60 70"><path d="M30 8c-10-10-18 3-7 8c-8 6 3 11 7 5c7-8-1-13-7-9" fill="none" stroke="#596573" stroke-width="4"/><path d="M30 20v6" stroke="#596573" stroke-width="4"/><rect x="9" y="26" width="42" height="35" rx="8" fill="url(#weightMetal)" stroke="#566170" stroke-width="1.5"/><ellipse cx="30" cy="28" rx="21" ry="5" fill="#e4e9ef" stroke="#566170"/><text x="30" y="48" text-anchor="middle" font-size="12" font-weight="800" fill="#202b38">1g</text></svg>
              <b>1 g</b><small>ドラッグ</small>
            </button>
            <button class="weight" data-mass="7" aria-label="7グラムのおもりをドラッグ">
              <svg viewBox="0 0 60 70"><path d="M30 8c-10-10-18 3-7 8c-8 6 3 11 7 5c7-8-1-13-7-9" fill="none" stroke="#596573" stroke-width="4"/><path d="M30 20v6" stroke="#596573" stroke-width="4"/><rect x="7" y="26" width="46" height="35" rx="8" fill="url(#weightMetal)" stroke="#566170" stroke-width="1.5"/><ellipse cx="30" cy="28" rx="23" ry="5" fill="#e4e9ef" stroke="#566170"/><text x="30" y="48" text-anchor="middle" font-size="12" font-weight="800" fill="#202b38">7g</text></svg>
              <b>7 g</b><small>ドラッグ</small>
            </button>
            <button class="weight" data-mass="10" aria-label="10グラムのおもりをドラッグ">
              <svg viewBox="0 0 60 70"><path d="M30 8c-10-10-18 3-7 8c-8 6 3 11 7 5c7-8-1-13-7-9" fill="none" stroke="#596573" stroke-width="4"/><path d="M30 20v6" stroke="#596573" stroke-width="4"/><rect x="5" y="26" width="50" height="35" rx="8" fill="url(#weightMetal)" stroke="#566170" stroke-width="1.5"/><ellipse cx="30" cy="28" rx="25" ry="5" fill="#e4e9ef" stroke="#566170"/><text x="30" y="48" text-anchor="middle" font-size="12" font-weight="800" fill="#202b38">10g</text></svg>
              <b>10 g</b><small>ドラッグ</small>
            </button>
            <button class="weight" data-mass="1000000" aria-label="1トンのおもりをドラッグ">
              <svg viewBox="0 0 60 70"><path d="M30 6c-10-10-18 3-7 8c-8 6 3 11 7 5c7-8-1-13-7-9" fill="none" stroke="#596573" stroke-width="4"/><path d="M30 18v7" stroke="#596573" stroke-width="4"/><rect x="3" y="24" width="54" height="39" rx="9" fill="url(#weightMetal)" stroke="#566170" stroke-width="1.5"/><ellipse cx="30" cy="27" rx="27" ry="6" fill="#e4e9ef" stroke="#566170"/><text x="30" y="49" text-anchor="middle" font-size="13" font-weight="800" fill="#202b38">1t</text></svg>
              <b>1 t</b><small>ドラッグ</small>
            </button>
          </div>
          <p class="hint">複数のおもりをつなげられます。取り外すときは、ぶら下がっているおもりをクリックしてください。</p>
          <button class="reset" id="reset">すべてのおもりを外す</button>
        </div>
      </section>
      <p class="hint">やわらかい：1gあたり7cm伸びます。かたい：1gあたり3cm伸びます。</p>
    </aside>
  </div>
</main>
<div id="ghost"></div>
<script>
const NS='http://www.w3.org/2000/svg';
const scene=document.getElementById('scene'), ticks=document.getElementById('ticks');
const spring=document.getElementById('springShadow'), springHi=document.getElementById('springHi');
const attached=document.getElementById('attached'), body=document.getElementById('attachedBody');
const indicator=document.getElementById('indicator'), hook=document.getElementById('hook'), hookHi=document.getElementById('hookHi');
let weights=[], stiffness='hard', currentPx=0, animFrame=0;
const restY=185, pxPerCm=3, maxPx=420, maxCm=maxPx/pxPerCm;
// Calibrated to the existing spring animation: 1 cm = 3 screen pixels.
for(let cm=0;cm<=140;cm++){
  const y=restY+cm*3;
  if(y>605) break;
  // 1 cm minor marks, 5 cm medium marks, 10 cm numbered marks.
  const major=cm%10===0, medium=cm%5===0;
  const line=document.createElementNS(NS,'line');
  line.setAttribute('x1',major?263:(medium?273:282));
  line.setAttribute('x2','289');
  line.setAttribute('y1',y);line.setAttribute('y2',y);
  line.setAttribute('stroke','#66717e');
  line.setAttribute('stroke-width',major?'1.8':(medium?'1.4':'0.8'));
  ticks.appendChild(line);
  if(major){
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x','292');t.setAttribute('y',y+4);
    t.setAttribute('font-size','11');t.setAttribute('font-weight','700');
    t.setAttribute('fill','#303b48');t.textContent=cm;ticks.appendChild(t);
  }
}
function springPath(y1,y2){
  const x=263, length=Math.max(8,y2-y1), loops=Math.max(8,Math.round(length/5)), amp=8;
  let d=`M ${x} ${y1}`;
  for(let i=1;i<=loops;i++){const y=y1+length*i/loops;const xx=x+(i%2?amp:-amp);d+=` L ${xx} ${y}`;}
  return d+` L ${x} ${y2}`;
}
function addWeight(mass){weights.push({mass,id:Date.now()+Math.random()});render();}
function massLabel(m){return m>=1000000?'1t':m+'g';}
function render(){
  const total=weights.reduce((s,w)=>s+w.mass,0);
  const cm=total*(stiffness==='soft'?7:3);
  const target=Math.min(maxPx,cm*pxPerCm);
  if(animFrame)cancelAnimationFrame(animFrame);
  const start=currentPx, startTime=performance.now(), duration=850;
  function frame(now){
    const t=Math.min(1,(now-startTime)/duration);
    const ease=t===1?1:1-Math.pow(2,-8*t)*Math.cos(t*Math.PI*4);
    currentPx=Math.max(0,start+(target-start)*ease);
    draw(currentPx,total,cm,cm*pxPerCm);
    if(t<1)animFrame=requestAnimationFrame(frame);else{currentPx=target;draw(target,total,cm,cm*pxPerCm);}
  }
  animFrame=requestAnimationFrame(frame);
}
function draw(px,total,cm,rawPx){
  const end=restY+px;
  const iy=restY+px;
  // The spring reaches the red pointer with no visible gap.
  spring.setAttribute('d',springPath(126,iy));
  springHi.setAttribute('d',springPath(126,iy));
  indicator.setAttribute('y1',iy);indicator.setAttribute('y2',iy);
  document.getElementById('movingHook').setAttribute('transform',`translate(0 ${px})`);
  attached.setAttribute('transform',`translate(263 ${222+px})`);
  body.replaceChildren();
  if(weights.length){
    attached.style.display='block';
    // Draw the actual selected weights as stacked, labelled metal masses.
    weights.forEach((w,i)=>{
      const g=document.createElementNS(NS,'g');g.setAttribute('transform',`translate(0 ${i*22})`);
      const label=massLabel(w.mass), font=w.mass>=1000000?10:12;
      g.innerHTML=`<path d="M0 -13v8" stroke="#4b5664" stroke-width="4" stroke-linecap="round"/><path d="M0 -13v8" stroke="#e7ebef" stroke-width="1.5"/><rect x="-25" y="-5" width="50" height="30" rx="7" fill="url(#weightMetal)" stroke="#566170" stroke-width="1.5"/><ellipse cx="0" cy="-3" rx="25" ry="5" fill="#e4e9ef" stroke="#566170"/><text x="0" y="15" text-anchor="middle" font-size="${font}" font-weight="800" fill="#202b38">${label}</text>`;
      body.appendChild(g);
    });
    attached.style.cursor='pointer';
  }else attached.style.display='none';
  const fmt=cm>=1000?Math.round(cm).toLocaleString('ja-JP'):Number(cm.toFixed(1)).toString();
  document.getElementById('extensionOnScene').textContent=fmt+' cm';
  document.getElementById('extension').textContent=fmt+' cm';
  document.getElementById('count').textContent=weights.length+' 個';
  document.getElementById('mass').textContent=total>=1000000?(total/1000000)+' t':total+' g';
  document.getElementById('overflow').style.display=rawPx>maxPx?'block':'none';
  document.getElementById('guide').setAttribute('d',`M 300 ${restY} H 322 V ${Math.min(605,restY+px)} H 300`);
}
document.getElementById('soft').onclick=()=>setStiffness('soft');
document.getElementById('hard').onclick=()=>setStiffness('hard');
function setStiffness(v){stiffness=v;document.getElementById('soft').setAttribute('aria-pressed',String(v==='soft'));document.getElementById('hard').setAttribute('aria-pressed',String(v==='hard'));render();}
document.getElementById('reset').onclick=()=>{weights=[];render();};
attached.addEventListener('click',()=>{if(weights.length){weights.pop();render();}});
document.querySelectorAll('.weight').forEach(el=>{
  el.addEventListener('pointerdown',e=>{
    e.preventDefault();const mass=Number(el.dataset.mass);
    const ghost=document.getElementById('ghost');ghost.innerHTML=el.innerHTML;ghost.style.display='flex';ghost.style.width='86px';ghost.style.flexDirection='column';ghost.style.alignItems='center';ghost.style.background='white';ghost.style.borderRadius='12px';ghost.style.padding='5px';ghost.style.border='1px solid #cfe5fc';
    moveGhost(e.clientX,e.clientY);
    const move=ev=>moveGhost(ev.clientX,ev.clientY);
    const up=ev=>{
      document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);ghost.style.display='none';
      const p=scene.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(scene.getScreenCTM().inverse());
      if(q.x>145&&q.x<330&&q.y>90&&q.y<650){
        if(mass>=1000000){
          window.alert('壊れました。実物じゃなくてよかったね');
          weights=[];
          render();
        }else{
          addWeight(mass);
        }
      }
    };
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up,{once:true});
  });
});
function moveGhost(x,y){const g=document.getElementById('ghost');g.style.left=(x-43)+'px';g.style.top=(y-42)+'px';}
draw(0,0,0,0);
</script>
</body>
</html>
